spring.application.name=ecoera
server.port=${PORT:8080}

# Banco SQL Server (pode sobrescrever com variáveis de ambiente)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=ecoera_db;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:ecoera2026}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# CORS: endereço(s) do front-end
ecoera.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:4200
